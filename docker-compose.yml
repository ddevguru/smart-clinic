version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Enterprise Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: smartclinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_clinic_os}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/migrations:/docker-entrypoint-initdb.d
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smart_clinic_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 2. Redis 7 High-Speed Caching & PubSub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smartclinic_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-smartclinic_redis_secret}"]
    volumes:
      - redis_data:/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 3. Node.js Express Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartclinic_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-smart_clinic_os}
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartclinic_redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-smartclinic_jwt_secret_key_32_characters}
      TELECONSULTATION_HMAC_SECRET: ${TELECONSULTATION_HMAC_SECRET:-smartclinic_tele_secret_key}
      FRONTEND_URL: https://clinic.smartclinic.in
    volumes:
      - storage_data:/app/server/storage
    networks:
      - internal_network
      - edge_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 4. Next.js 14 Frontend Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartclinic_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://api.smartclinic.in
    networks:
      - edge_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 5. Nginx Production Edge Proxy & SSL Terminator
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: smartclinic_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - edge_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

networks:
  internal_network:
    driver: bridge
    internal: true
  edge_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:

